<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Pet Bem-Estar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div th:replace="~{fragments/cabecalho :: cabecalho}"></div>
    <div class="login-container">
        <h1>Pet Bem-Estar</h1>
        <p style="text-align: center; color: #555;">Acesse sua conta</p>

        <div th:if="${mensagem}" style="color: green; margin-bottom: 15px; text-align: center;" th:text="${mensagem}"></div>
        <div th:if="${erro}" style="color: red; margin-bottom: 15px; text-align: center;" th:text="${erro}"></div>

        <form th:action="@{/login}" method="post">
            <p>
                <label>Usuário ou E-mail</label>
                <input type="text" name="email" th:value="${email}" required>
            </p>
            <p>
                <label>Senha</label>
                <input type="password" name="senha" required>
            </p>
            <button type="submit" class="btn-novo" style="width: 100%;">Entrar</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a th:href="@{/cadastro}">Criar uma conta</a>
        </div>
    </div>
</body>
</html>
