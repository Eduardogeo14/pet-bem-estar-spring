<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tutores</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Cabeçalho -->
    <div th:replace="~{fragments/cabecalho :: cabecalho}"></div>

    <!-- Alerta de Sucesso -->
    <div th:if="${mensagem}" class="alerta-sucesso">
        <span th:text="${mensagem}"></span>
    </div>

    <!-- Alerta de Erro (ex: não pode remover tutor com bicho) -->
    <div th:if="${erro}" class="alerta-erro">
        <span th:text="${erro}"></span>
    </div>

    <h1>Lista de Tutores</h1>
    
    <a th:href="@{/paginas/tutores/novo}" class="btn-novo" style="margin-bottom: 20px;">Cadastrar Novo Tutor</a>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tutor : ${tutores}">
                <td th:text="${tutor.id}">Id</td>
                <td>
                    <a th:href="@{/paginas/tutores/{id}(id=${tutor.id})}" th:text="${tutor.nome}"></a>
                </td>
                <td th:text="${tutor.email}">Email</td>
                <td th:text="${tutor.telefone}">Telefone</td>
                <td>
                    <a th:href="@{/paginas/tutores/{id}/editar(id=${tutor.id})}">Editar</a>
                    <form th:action="@{/paginas/tutores/{id}/remover(id=${tutor.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn-remover" onclick="return confirm('Tem certeza que deseja remover este tutor?');">Remover</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
